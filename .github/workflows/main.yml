name: Update Server Status

permissions:
  contents: read

on:
  schedule:
    - cron: '*/5 * * * *'   # Ajaa skriptin 5 minuutin välein
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
          MESSAGE_IDS: ${{ secrets.MESSAGE_IDS }}
          BATTLEMETRICS_SERVER_ID: ${{ secrets.BATTLEMETRICS_SERVER_ID }}
        run: python -u status.py
